name: Update rankings

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

# A manual dispatch racing the scheduled run would make the two
# git-auto-commit steps fight over the same files.
concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if already updated today
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'EOF'
          import json, os
          from datetime import datetime, timezone, timedelta
          beijing = timezone(timedelta(hours=8))
          today_bj = datetime.now(beijing).date()
          try:
              gen = json.load(open("data/rankings.json"))["metadata"]["generated_at"]
              last_bj = datetime.fromisoformat(gen.replace("Z", "+00:00")).astimezone(beijing).date()
              needed = "false" if last_bj >= today_bj else "true"
          except Exception:
              needed = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run_needed={needed}\n")
          print(f"Schedule check: today_bj={today_bj}, run_needed={needed}")
          EOF

      - name: Install OG cover rendering deps
        if: steps.gate.outputs.run_needed == 'true'
        # cairosvg rasterizes assets/og-cover.svg into the PNG that social
        # crawlers actually display (OG/Twitter cards do not render SVG).
        # Noto CJK fonts are needed or the Chinese headline turns into tofu.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install cairosvg

      - name: Update ranking data
        if: steps.gate.outputs.run_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_rankings.py

      - name: Auto-enrich unreviewed Skill discipline profiles
        if: steps.gate.outputs.run_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/auto_enrich_disciplines.py --limit 25 --sync-rankings

      - name: Check curated source documents
        if: steps.gate.outputs.run_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_editorial_docs.py

      - name: Run tests
        if: steps.gate.outputs.run_needed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Commit updated rankings
        if: steps.gate.outputs.run_needed == 'true'
        id: commit
        run: |
          git config user.name "RiceAI88"
          git config user.email "275014869+RiceAI88@users.noreply.github.com"
          # 通配符必须加引号交给 git pathspec 匹配；由 shell 展开会漏掉
          # 按 60 天保留期删除的历史快照，导致删除无法提交、rebase 被未暂存改动阻断。
          paths=(
            config/disciplines.json config/discipline-sources.json
            data/repository-catalog.json data/collection-report.json data/collection-events.json
            README.md README_EN.md data/first-seen.json data/editorial-status.json data/rankings.json
            data/rankings.js data/history.js data/rankings.csv 'data/history/*.json'
            sitemap.xml feed.xml 'assets/og-cover*' 'reports/*.html'
          )
          git add -A -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update academic research skill rankings"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (remote main advanced during collection); rebasing and retrying ($attempt/3)..."
            git fetch origin main
            # autostash 兜住范围外的临时改动；冲突无法自动解决时中止本次 rebase，避免下一轮卡在进行中的 rebase。
            if ! git rebase --autostash -X theirs origin/main; then
              git rebase --abort || true
            fi
          done
          exit 1

      - name: Redeploy GitHub Pages
        # The auto-commit uses GITHUB_TOKEN, whose pushes do NOT trigger other
        # `on: push` workflows — so Pages would otherwise serve stale data.
        # Re-trigger the Pages deploy explicitly when data changed.
        if: steps.commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main',
            });

      - name: Upload collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics
          path: data/collection-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Close failure issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-update-failure',
              per_page: 5,
            });
            for (const issue of existing.data) {
              const runLink = `[run #${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved by successful ranking update at ${new Date().toISOString()} (${runLink}).`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runLink = `[run #${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const body = `The daily update workflow failed at ${new Date().toISOString()}. See ${runLink}.`;
            // Comment on the existing failure issue instead of opening a new
            // one per failed day — a multi-day outage would otherwise spam.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-update-failure',
              per_page: 1,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Ranking update failed on ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: ['auto-update-failure'],
              });
            }
